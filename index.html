<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1A1E1C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M21 3l8 8-3 1-6 6c1.6 2.8 1 6.6-1.8 9.4-3.4 3.4-8.4 3.8-11.2 1S4.6 21 8 17.6C10.8 14.8 14.6 14.2 17.4 15.8l6-6z' fill='none' stroke='%23D2541C' stroke-width='2.4'/%3E%3C/svg%3E">
<title>TM Guitar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky header with three tabs; library list + detail; rig shown as a dark pedalboard strip with signal flow left→right */
:root{
  --bg:#ECEFEB; --panel:#FAFBF9; --ink:#1A1E1C; --muted:#5D6661; --line:#D2D8D3; --soft:#E2E7E2;
  --accent:#D2541C; --accent-ink:#A9420F; --on:#E8402F; --ok:#2E8A57;
  --board:#262A28; --board-2:#303532; --board-ink:#E9ECE9; --board-muted:#A4ADA8; --board-line:#3F4642;
  --stage:#0E100F; --stage-ink:#F1F3F1; --stage-chord:#FFA066; --stage-muted:#8E9792;
  --f-display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121514; --panel:#1A1E1C; --ink:#E7EBE8; --muted:#97A19B; --line:#2C3330; --soft:#232826;
  --accent:#FF8448; --accent-ink:#FF9A66; --on:#FF5A44; --ok:#4CC27E;
  --board:#0C0E0D; --board-2:#181C1A; --board-ink:#E9ECE9; --board-muted:#9AA39E; --board-line:#2C3330;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121514; --panel:#1A1E1C; --ink:#E7EBE8; --muted:#97A19B; --line:#2C3330; --soft:#232826;
  --accent:#FF8448; --accent-ink:#FF9A66; --on:#FF5A44; --ok:#4CC27E;
  --board:#0C0E0D; --board-2:#181C1A; --board-ink:#E9ECE9; --board-muted:#9AA39E; --board-line:#2C3330;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:18px;padding-block:10px;flex-wrap:wrap;max-width:1320px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.02em}
.brand svg{width:26px;height:26px}
.tabs{display:flex;gap:4px;background:var(--soft);padding:3px;border-radius:9px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:7px;font-weight:500;color:var(--muted)}
.tabs button[aria-current="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.hstat{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.local{background:var(--accent)}

main{max-width:1320px;margin:0 auto;padding-block:18px 60px}
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.split{grid-template-columns:minmax(0,1fr)} .split.has-sel .side{display:none} .split:not(.has-sel) .detail{display:none}}
@media (min-width:861px){.back{display:none!important}}

/* sidebar list */
.side{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:sticky;top:76px}
.side-h{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.side-h input{flex:1;min-width:0}
.list{max-height:calc(100vh - 190px);overflow:auto}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.item:hover{background:var(--soft)}
.item[aria-current="true"]{background:var(--soft);box-shadow:inset 3px 0 0 var(--accent)}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .k{grid-row:1/3;grid-column:2;align-self:center;font-family:var(--f-mono);font-size:12px;color:var(--accent-ink)}
.leds{display:flex;gap:3px;margin-top:3px}
.leds i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.leds i.on{background:var(--on)}
.empty{padding:28px 18px;color:var(--muted);text-align:center;font-size:14px}

/* controls */
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:8px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--on)}
.btn.danger.arm{background:var(--on);color:#fff;border-color:var(--on)}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;resize:vertical}
label.f{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
label.f > input,label.f > select,label.f > textarea{color:var(--ink);font-size:15px}
.grid-f{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.seg{display:inline-flex;flex-wrap:wrap;gap:3px;background:var(--soft);padding:3px;border-radius:9px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* detail */
.detail{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.dh{padding:18px 20px 14px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.dh h1{font-family:var(--f-display);font-size:28px;line-height:1.15;margin:0;text-wrap:balance;font-weight:700}
.dh .by{color:var(--muted);margin-top:-6px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip b{color:var(--ink);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.sp{justify-content:space-between}
.body{padding:18px 20px 22px}
.ex{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--f-display);font-weight:600;background:var(--soft);color:var(--muted);border-radius:4px;padding:1px 6px}
.hint{font-size:13px;color:var(--muted)}
h2.sec{font-family:var(--f-display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}

/* sheet */
.sheet{font-size:var(--fs,17px);line-height:1.3}
.sheet .ln{display:flex;flex-wrap:wrap;align-items:flex-end;min-height:1.4em;margin-bottom:.35em}
.sheet .sg{display:inline-flex;flex-direction:column;white-space:pre}
.sheet .ch{font-family:var(--f-mono);font-weight:600;color:var(--accent-ink);font-size:.86em;padding-right:.5em;min-height:1.25em}
.sheet .ln.nochord .ch{display:none}
.sheet .ln.chordonly .ly{display:none}
.sheet .lbl{font-family:var(--f-display);font-weight:600;font-size:.72em;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:1.1em 0 .4em;border-top:1px solid var(--line);padding-top:.5em}
.sheet .lbl:first-child{margin-top:0;border-top:0;padding-top:0}
.sheet .gap{height:.7em}
.diags{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.dg{display:grid;justify-items:center;gap:2px;width:72px}
.dg b{font-family:var(--f-mono);font-size:13px}
.dg svg{width:66px;height:80px}
.dg .no{font-size:11px;color:var(--muted);height:80px;display:grid;place-items:center;text-align:center}
.dgs line,.dgs rect.nut{stroke:var(--ink)}
.dgs .dotc{fill:var(--ink)}
.dgs text{fill:var(--muted);font-family:var(--f-mono);font-size:9px}
.trans{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}

/* board */
.board{background:var(--board);color:var(--board-ink);border-radius:var(--r);padding:16px;
  background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.4px);background-size:5px 5px}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px}
.node{background:var(--board-2);border:1px solid var(--board-line);border-radius:9px;padding:12px;min-width:0}
.arrow{align-self:center;color:var(--board-muted);font-family:var(--f-mono)}
.node h3{margin:0 0 8px;font-family:var(--f-display);font-size:14px;letter-spacing:.06em;font-weight:600}
.node .sub{font-size:12px;color:var(--board-muted)}
.board select,.board input[type=text],.board input[type=number],.board textarea{background:#00000040;border-color:var(--board-line);color:var(--board-ink)}
.board .seg{background:#00000040}
.board .seg button{color:var(--board-muted)}
.board .seg button[aria-pressed="true"]{background:var(--board-ink);color:#111}
.board .btn{background:transparent;border-color:var(--board-line);color:var(--board-ink)}
.board .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.board .hint{color:var(--board-muted)}
.guitar-node{flex:1 1 280px}
.gstrip{height:6px;border-radius:3px;margin:-4px 0 10px}

/* knobs */
.knobs{display:flex;flex-wrap:wrap;gap:10px 6px}
.knob{display:grid;justify-items:center;gap:0;width:64px;touch-action:none;user-select:none;cursor:ns-resize;border-radius:8px;padding:2px 0}
.knob svg{width:46px;height:46px}
.knob .kv{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.knob .kl{font-size:11px;color:var(--board-muted);text-align:center;line-height:1.15;max-width:64px;overflow-wrap:anywhere}
.knob .trk{stroke:#ffffff26;fill:none;stroke-width:3.2}
.knob .val{stroke:var(--accent);fill:none;stroke-width:3.2;stroke-linecap:round}
.knob .cap{fill:#1b1d1c;stroke:#555c58}
.knob .ptr{stroke:#f1f1f1;stroke-width:2.4;stroke-linecap:round}
.knob.drag .kv{color:var(--accent)}

/* GT-1 unit */
.unit{flex:1 1 100%;background:#141615;border-color:#3a403c;position:relative}
.unit-h{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.lcd{font-family:var(--f-mono);background:#1d2a20;color:#9cf2b0;border:1px solid #2f4a36;border-radius:6px;padding:4px 10px;display:flex;gap:8px;align-items:center;font-size:14px}
.lcd input{background:transparent!important;border:0!important;color:#9cf2b0!important;font-family:var(--f-mono);padding:0!important;width:4.5ch}
.lcd input.nm{width:16ch}
.chain{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.blk{flex:0 0 auto;display:grid;justify-items:center;gap:3px;background:#202422;border:1px solid #3a403c;border-radius:7px;padding:7px 9px 6px;min-width:70px;color:var(--board-ink)}
.blk[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.blk .bn{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.05em}
.blk .bt{font-size:10px;color:var(--board-muted);max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.led{width:9px;height:9px;border-radius:50%;background:#3b2522;border:0;padding:0}
.led.on{background:var(--on);box-shadow:0 0 8px var(--on)}
.bedit{display:grid;gap:12px;background:#1a1d1b;border:1px solid #2f3532;border-radius:8px;padding:12px}
.unit .hint{font-size:12.5px}
.tsl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;border-top:1px dashed #3a403c;margin-top:12px;padding-top:10px}

/* stomp pedal */
.pedal{flex:0 0 156px;border-radius:12px;padding:10px 10px 12px;display:grid;gap:8px;justify-items:center;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 3px 0 rgba(0,0,0,.35);position:relative}
.pedal.off{filter:saturate(.45) brightness(.75)}
.pedal .pn{font-family:var(--f-display);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.04em;text-align:center;line-height:1.1}
.pedal .pb{font-size:11px;opacity:.8}
.pedal .knob .kl{color:inherit;opacity:.85}
.pedal .knob{width:46px}
.pedal .knob svg{width:38px;height:38px}
.foot{width:36px;height:36px;border-radius:50%;background:radial-gradient(#d9dcdb,#8b908d);border:2px solid #555;padding:0}
.pedal .pctl{display:flex;gap:4px}
.pedal .pctl button{background:#0003;border:0;border-radius:5px;color:inherit;padding:2px 7px;font-size:12px}

.add-unit{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.outnode{flex:0 1 200px}

/* gear page */
.gear{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px;align-items:start}
.gcard{display:grid;gap:12px;padding:14px;border-top:1px solid var(--line)}
.gcard:first-of-type{border-top:0}
.gtitle{display:flex;gap:12px;align-items:center}
.swatch{width:34px;height:34px;border-radius:8px;flex:0 0 auto;border:1px solid var(--line)}
.gtitle .t{font-weight:600}
.gtitle .s{font-size:12.5px;color:var(--muted)}

/* playlist */
.pl-songs{display:grid;gap:6px;margin:12px 0}
.pls{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.pls .n{font-family:var(--f-mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.pls .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pls .s{font-size:12.5px;color:var(--muted)}

/* stage */
.stage{position:fixed;inset:0;z-index:50;background:var(--stage);color:var(--stage-ink);display:flex;flex-direction:column;color-scheme:dark}
.st-top{padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid #262b28;display:grid;gap:8px}
.st-title{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.st-title h2{margin:0;font-family:var(--f-display);font-size:24px;font-weight:700}
.st-title .m{color:var(--stage-muted);font-size:14px;font-variant-numeric:tabular-nums}
.beat{width:10px;height:10px;border-radius:50%;background:var(--stage-chord);display:inline-block;animation:beat var(--bp,.7s) steps(1) infinite}
@keyframes beat{0%{opacity:1}30%{opacity:.15}}
@media (prefers-reduced-motion:reduce){.beat{animation:none}}
.st-ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.st-ctl button{background:#1d211f;border:1px solid #333a36;color:var(--stage-ink);border-radius:8px;padding:5px 11px;font-size:14px}
.st-ctl button[aria-pressed="true"]{background:var(--stage-chord);color:#111;border-color:var(--stage-chord)}
.st-ctl .v{font-family:var(--f-mono);font-size:13px;min-width:3ch;text-align:center;color:var(--stage-muted)}
.tone-strip{display:flex;gap:6px;overflow-x:auto;font-size:12.5px;padding-bottom:2px}
.tone-strip span{flex:0 0 auto;background:#1a1e1c;border:1px solid #2c322f;border-radius:6px;padding:3px 8px;white-space:nowrap}
.tone-strip b{color:var(--stage-chord);font-family:var(--f-display);font-weight:600;margin-right:4px}
.st-body{flex:1;overflow:auto;padding-block:20px 40vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.st-body .inner{max-width:900px;margin:0 auto}
.stage .sheet .ch{color:var(--stage-chord)}
.stage .sheet .lbl{color:var(--stage-muted);border-color:#262b28}
.stage .dgs line,.stage .dgs rect.nut{stroke:var(--stage-ink)}
.stage .dgs .dotc{fill:var(--stage-ink)}
.stage .dg b{color:var(--stage-ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;z-index:60}
.loading{padding:60px 16px;text-align:center;color:var(--muted)}
.notice{background:var(--soft);border-radius:8px;padding:10px 14px;font-size:13.5px;color:var(--muted)}
</style>

.login{display:grid;place-items:center;min-height:80vh;padding-block:30px}
.login-card{width:min(400px,100%);padding:24px}

const SH=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"], FL=["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
function noteIdx(n){ let i=SH.indexOf(n); if(i<0) i=FL.indexOf(n); if(i<0){ const alt={"E#":5,"B#":0,"Fb":4,"Cb":11}; i = alt[n] ?? -1; } return i; }
function parseChord(c){

function renderSheet(body, s, key){
  const flat = useFlats(transposeKey(key||"C", s));
  const out=[]; const used=[];
  for(const raw of (body||"").split("\n")){
    const line=raw.replace(/\s+$/,"");
    if(!line.trim()){ out.push('<div class="gap"></div>'); continue; }
    if(/^#/.test(line)){ out.push(`<div class="lbl">${esc(line.replace(/^#+\s*/,""))}</div>`); continue; }
    const re=/\[([^\]]+)\]/g; let m, last=0, segs=[], cur={c:"",t:""};
    while((m=re.exec(line))){ cur.t+=line.slice(last,m.index); segs.push(cur); const c=tChord(m[1],s,flat); cur={c,t:""}; if(!used.includes(c)) used.push(c); last=re.lastIndex; }
    cur.t+=line.slice(last); segs.push(cur);
    segs = segs.filter((g,i)=> i>0 || g.t);
    const hasChord = segs.some(g=>g.c), hasText = segs.some(g=>g.t.trim());
    const cls = !hasChord ? "nochord" : !hasText ? "chordonly" : "";
    if(!hasText && hasChord){ out.push(`<div class="ln ${cls}">`+segs.map(g=>`<span class="sg"><span class="ch">${esc(g.c)}${esc(g.t.replace(/\[|\]/g,""))}</span></span>`).join("")+`</div>`); continue; }
    out.push(`<div class="ln ${cls}">`+segs.map(g=>`<span class="sg"><span class="ch">${esc(g.c)||"&nbsp;"}</span><span class="ly">${g.t?esc(g.t):"&nbsp;"}</span></span>`).join("")+`</div>`);
  }

}

  "C":[-1,3,2,0,1,0],"D":[-1,-1,0,2,3,2],"E":[0,2,2,1,0,0],"G":[3,2,0,0,0,3],"A":[-1,0,2,2,2,0],

  "C7":[-1,3,2,3,1,0],"D7":[-1,-1,0,2,1,2],"E7":[0,2,0,1,0,0],"G7":[3,2,0,0,0,1],"A7":[-1,0,2,0,2,0],"B7":[-1,2,1,2,0,2],
  "Am7":[-1,0,2,0,1,0],"Dm7":[-1,-1,0,2,1,1],"Em7":[0,2,0,0,0,0],
  "Cmaj7":[-1,3,2,0,0,0],"Fmaj7":[-1,-1,3,2,1,0],"Dmaj7":[-1,-1,0,2,2,2],"Amaj7":[-1,0,2,1,2,0],"Gmaj7":[3,2,0,0,0,2],
  "Asus2":[-1,0,2,2,0,0],"Asus4":[-1,0,2,2,3,0],"Dsus2":[-1,-1,0,2,3,0],"Dsus4":[-1,-1,0,2,3,3],"Esus4":[0,2,2,2,0,0],"Cadd9":[-1,3,2,0,3,0],
  "D/F#":[2,0,0,2,3,2],"G/B":[-1,2,0,0,0,3],"C/G":[3,3,2,0,1,0],"C/B":[-1,2,2,0,1,0],"Am/G":[3,0,2,2,1,0],"F/C":[-1,3,3,2,1,1]
};
const EFORM={"":[0,2,2,1,0,0],"m":[0,2,2,0,0,0],"7":[0,2,0,1,0,0],"m7":[0,2,0,0,0,0],"sus4":[0,2,2,2,0,0]};
const AFORM={"":[-1,0,2,2,2,0],"m":[-1,0,2,2,1,0],"7":[-1,0,2,0,2,0],"m7":[-1,0,2,0,1,0],"maj7":[-1,0,2,1,2,0],"sus4":[-1,0,2,2,3,0],"sus2":[-1,0,2,2,0,0]};
function normQ(q){ return ({"min":"m","-":"m","M7":"maj7","Maj7":"maj7","ma7":"maj7","sus":"sus4","dom7":"7"})[q] ?? q; }
function shapeFor(name){
  if(OPEN[name]) return OPEN[name];
  const p=parseChord(name); if(!p) return null;
  const q=normQ(p.q); const key=SH[noteIdx(p.root)]+q;
  if(!p.bass){ const k2 = FL[noteIdx(p.root)]+q; if(OPEN[key]) return OPEN[key]; if(OPEN[k2]) return OPEN[k2]; }
  const ri=noteIdx(p.root); if(ri<0) return null;
  const fe=((ri-4)%12+12)%12, fa=((ri-9)%12+12)%12;
  const cands=[];
  if(EFORM[q] && fe>0) cands.push([fe, EFORM[q]]);
  if(AFORM[q] && fa>0) cands.push([fa, AFORM[q]]);
  if(!cands.length) return null;
  cands.sort((a,b)=>a[0]-b[0]);
  const [f,sh]=cands[0];
  return sh.map(v=>v<0?-1:v+f);
}
function diagramSVG(name){
  const sh=shapeFor(name);
  if(!sh) return `<div class="dg"><b>${esc(name)}</b><div class="no">ไม่มีภาพ<br>คอร์ด</div></div>`;
  const fr=sh.filter(v=>v>0); const mx=Math.max(0,...fr), mn=fr.length?Math.min(...fr):1;
  const base = mx<=4 ? 1 : mn;
  const x=i=>10+i*9.2, y=f=>16+(f-base+0.5)*12;
  let g=`<svg viewBox="0 0 66 80" class="dgs" aria-hidden="true">`;
  g+= base===1 ? `<rect class="nut" x="10" y="15" width="46" height="2" fill="none" stroke-width="2"/>` : `<text x="58" y="25">${base}</text>`;
  for(let i=0;i<6;i++) g+=`<line x1="${x(i)}" y1="16" x2="${x(i)}" y2="76" stroke-width=".8"/>`;
  for(let f=0;f<=5;f++) g+=`<line x1="10" y1="${16+f*12}" x2="56" y2="${16+f*12}" stroke-width=".8"/>`;
  // barre detection: lowest fret shared by string 0/1 and last string
  const barre = base>1 || (sh[0]===sh[5] && sh[0]>0);
  if(barre){ const bf=Math.min(...fr); const strs=sh.map((v,i)=>v===bf?i:-1).filter(i=>i>=0); if(strs.length>=3){ g+=`<rect class="dotc" x="${x(strs[0])-3}" y="${y(bf)-3.2}" width="${x(strs[strs.length-1])-x(strs[0])+6}" height="6.4" rx="3.2"/>`; } }
  sh.forEach((v,i)=>{
    if(v<0) g+=`<text x="${x(i)-2.6}" y="11">×</text>`;
    else if(v===0) g+=`<circle cx="${x(i)}" cy="8" r="2.6" fill="none" class="dotc" style="fill:none;stroke:currentColor" stroke-width=".9"/>`;
    else g+=`<circle class="dotc" cx="${x(i)}" cy="${y(v)}" r="3.4"/>`;
  });
  return `<div class="dg"><b>${esc(name)}</b>${g}</svg></div>`;
}

/* ---------- chord sheet converter (chords above lyrics -> [chord]lyric) ---------- */
const CHORD_RE=/^[A-G][#b]?(?:maj|min|dim|aug|sus|add|m|M|\+|°)?(?:[0-9]+|(?:sus|add|maj|b|#|\+|-)[0-9]+)*(?:\([^)]*\))?(?:\/[A-G][#b]?)?$/;
const SKIP_RE=/^(?:x\d+|\|+|\/+|-+|%|\.+)$/i;
const SECTION_RE=/^\[?\s*((?:intro|verse|chorus|pre[- ]?chorus|bridge|solo|outro|interlude|ending|instrumental|hook|refrain|tag|coda)[^\]\n]*|ท่อน[^\]\n]*|อินโทร[^\]\n]*|เมนเพลง[^\]\n]*)\]?\s*:?$/i;
const ZW=/[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]/;
const HAS_APP_CHORD=/\[[A-G][^\]]*\]/;
function chordTokens(line){ const out=[]; const re=/[^\s|]+/g; let m; while((m=re.exec(line))) out.push({t:m[0],c:m.index}); return out; }
function isChordLine(line){
  const toks=chordTokens(line); if(!toks.length) return false; let n=0;
  for(const k of toks){ if(CHORD_RE.test(k.t)) n++; else if(!SKIP_RE.test(k.t)) return false; }
  return n>0;
}
function mergeLine(chords, lyric){
  const col=[]; let c=0;
  for(let i=0;i<lyric.length;i++){ col.push(c); if(!ZW.test(lyric[i])) c++; }
  const pos=chords.map(k=>{
    let idx=col.findIndex(x=>x>=k.c); if(idx<0) idx=lyric.length;
    while(idx<lyric.length && ZW.test(lyric[idx])) idx++;
    return {idx,t:k.t};
  });
  let res=lyric;
  for(let i=pos.length-1;i>=0;i--) res=res.slice(0,pos[i].idx)+"["+pos[i].t+"]"+res.slice(pos[i].idx);
  return res;
}
function convertChordSheet(text){
  const L=String(text||"").replace(/\r/g,"").replace(/\t/g,"    ").split("\n"); const out=[];
  for(let i=0;i<L.length;i++){
    const line=L[i].replace(/\s+$/,"");
    if(!line.trim()){ out.push(""); continue; }
    if(HAS_APP_CHORD.test(line)){ out.push(line); continue; }
    const chordy=isChordLine(line);
    const sec=!chordy && SECTION_RE.exec(line.trim());
    if(sec){ out.push("# "+sec[1].trim().replace(/:$/,"")); continue; }
    if(chordy){
      const chords=chordTokens(line).filter(k=>CHORD_RE.test(k.t));
      const next=L[i+1];
      if(next!==undefined && next.trim() && !isChordLine(next) && !SECTION_RE.test(next.trim()) && !HAS_APP_CHORD.test(next)){
        out.push(mergeLine(chords, next.replace(/\s+$/,""))); i++;
      } else out.push(chords.map(k=>"["+k.t+"]").join(" "));
      continue;
    }
    out.push(line);
  }
  return out.join("\n").replace(/\n{3,}/g,"\n\n").trim();
}

/* ---------- knob ---------- */
function arc(r,a0,a1){ const pt=a=>[20+r*Math.sin(a*Math.PI/180), 20-r*Math.cos(a*Math.PI/180)]; const [x0,y0]=pt(a0),[x1,y1]=pt(a1); const large=Math.abs(a1-a0)>180?1:0; const sw=a1>a0?1:0; return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${large} ${sw} ${x1.toFixed(2)} ${y1.toFixed(2)}`; }
function stepOf(p){ const r=p.max-p.min; return r<=10 ? 0.1 : 1; }
function fmt(p,v){ const s=stepOf(p); const t = s<1 ? v.toFixed(1) : String(Math.round(v)); return t + (p.u && p.u!=="×0.1s" ? `<small> ${esc(p.u)}</small>` : p.u==="×0.1s" ? `<small> = ${(v/10).toFixed(1)}s</small>`:""); }
function knobInner(p){
  const f=(p.v-p.min)/(p.max-p.min||1); const a=-135+f*270;
  const zero = p.min<0 ? 0 : -135; const z = p.min<0 ? -135+((0-p.min)/(p.max-p.min))*270 : -135;
  const va = Math.abs(a-z)<0.5 ? "" : `<path class="val" d="${a>z?arc(17,z,a):arc(17,a,z)}"/>`;
  void zero;
  return `<svg viewBox="0 0 40 40" aria-hidden="true"><path class="trk" d="${arc(17,-135,135)}"/>${va}<circle class="cap" cx="20" cy="20" r="12"/><line class="ptr" x1="20" y1="20" x2="20" y2="10" transform="rotate(${a.toFixed(1)} 20 20)"/></svg>`;
}
function knob(p, attrs){
  return `<div class="knob" tabindex="0" role="slider" aria-label="${esc(p.n)}" aria-valuemin="${p.min}" aria-valuemax="${p.max}" aria-valuenow="${p.v}" ${attrs}>${knobInner(p)}<span class="kv">${fmt(p,p.v)}</span><span class="kl">${esc(p.n)}</span></div>`;
}

/* ---------- stage mode ---------- */
const ST = { queue:[], i:0, scroll:false, speed:3, raf:0, lock:null, last:0, acc:0 };
function openStage(queue, i=0){
  ST.queue=queue; ST.i=i; ST.scroll=false; $("#stage").hidden=false; document.body.style.overflow="hidden"; renderStage();
  try{ navigator.wakeLock?.request("screen").then(l=>ST.lock=l).catch(()=>{}); }catch(e){}
}
function closeStage(){ $("#stage").hidden=true; document.body.style.overflow=""; ST.scroll=false; cancelAnimationFrame(ST.raf); try{ST.lock?.release();}catch(e){} ST.lock=null; render(); }
function toneStrip(s){
  const g=Store.get(s.guitarId); const parts=[];
  if(g){ const pos=(PICKUPS[g.pickups]||[])[s.pickup||0]; const kn=(g.knobs||[]).map(n=>`${n.replace(/Tone \((\w+)\)/,"T.$1")} ${s.gknobs?.[n]??10}`).join(" · "); parts.push(`<span><b>${esc(g.name.split(" ").slice(-1)[0]==="Stratocaster"?"Rory Strat":g.name)}</b>${esc(pos||"")} · ${esc(kn)}</span>`); }
  for(const u of s.rig||[]){ if(!u.on) continue; const d=Store.get(u.deviceId); if(!d) continue;
    if(d.form==="multi"){ parts.push(`<span><b>${esc(d.name)}</b>${esc(u.slot)} ${esc(u.patchName||"")}</span>`);
      u.blocks.filter(b=>b.on && b.key!=="fv" && b.key!=="ns").forEach(b=>parts.push(`<span><b>${esc(b.label)}</b>${esc(b.type)} ${b.params.map(p=>`${esc(p.n)} ${stepOf(p)<1?p.v.toFixed(1):Math.round(p.v)}${p.u==="ms"?"ms":""}`).join(" · ")}</span>`));
    } else { const b=u.blocks[0]; parts.push(`<span><b>${esc(d.name)}</b>${b.params.map(p=>`${esc(p.n)} ${p.v.toFixed(1)}`).join(" · ")}</span>`); }
  }
  if(s.toneNotes) parts.push(`<span>${esc(s.toneNotes)}</span>`);
  return parts.join("");
}
function renderStage(){
  const s=Store.get(ST.queue[ST.i]); if(!s){ closeStage(); return; }
  const tr=s.transpose||0; const r=renderSheet(s.body,tr,s.key);
  const bp = s.bpm ? (60/s.bpm).toFixed(3)+"s" : "";
  $("#stage").innerHTML = `<div class="st-top">
    <div class="st-title"><h2>${esc(s.title)}</h2><span class="m">${esc(s.artist)}</span>
      <span class="m">Key <b style="color:var(--stage-chord)">${esc(transposeKey(s.key,tr))}</b>${+s.capo?` · Capo ${+s.capo}`:""}${s.bpm?` · ${+s.bpm} BPM <span class="beat" style="--bp:${bp}"></span>`:""} · ${esc(s.tuning)}</span>
      ${ST.queue.length>1?`<span class="m">เพลงที่ ${ST.i+1}/${ST.queue.length}</span>`:""}</div>
    <div class="tone-strip">${toneStrip(s)}</div>
    <div class="st-ctl">
      ${ST.queue.length>1?`<button data-st="prev" ${ST.i?"":"disabled"}>◀ ก่อนหน้า</button><button data-st="next" ${ST.i<ST.queue.length-1?"":"disabled"}>ถัดไป ▶</button>`:""}
      <button data-st="tr" data-v="-1" aria-label="ลดคีย์">♭</button><span class="v">${tr>0?"+":""}${tr}</span><button data-st="tr" data-v="1" aria-label="เพิ่มคีย์">♯</button>
      <button data-st="fs" data-v="-2">A−</button><button data-st="fs" data-v="2">A+</button>
      <button data-st="scroll" aria-pressed="${ST.scroll}">${ST.scroll?"❚❚ หยุดเลื่อน":"▼ เลื่อนอัตโนมัติ"}</button><button data-st="sp" data-v="-1" aria-label="ช้าลง">−</button><span class="v">${ST.speed}</span><button data-st="sp" data-v="1" aria-label="เร็วขึ้น">+</button>
      <button data-st="diag" aria-pressed="${!!S.stDiag}">ภาพคอร์ด</button>
      <span style="flex:1"></span><button data-st="close">✕ ปิด</button></div></div>
  <div class="st-body" id="stbody"><div class="inner">${S.stDiag&&r.used.length?`<div class="diags">${r.used.map(diagramSVG).join("")}</div>`:""}<div class="sheet" style="--fs:${S.fs+6}px">${r.html}</div>${s.notes?`<p style="color:var(--stage-muted);margin-top:2em">${esc(s.notes)}</p>`:""}</div></div>`;
}
function scrollLoop(t){
  if(!ST.scroll) return; const el=$("#stbody");
  if(el){ const dt=ST.last? (t-ST.last)/1000 : 0; ST.acc += dt*ST.speed*9; const px=Math.floor(ST.acc); if(px){ el.scrollTop+=px; ST.acc-=px; } }
  ST.last=t; ST.raf=requestAnimationFrame(scrollLoop);
}
$("#stage").addEventListener("click",e=>{
  const b=e.target.closest("[data-st]"); if(!b) return; const a=b.dataset.st, v=+b.dataset.v;
  const s=Store.get(ST.queue[ST.i]);
  if(a==="close") return closeStage();
  if(a==="prev"||a==="next"){ ST.i=clamp(ST.i+(a==="next"?1:-1),0,ST.queue.length-1); ST.scroll=false; renderStage(); $("#stbody").scrollTop=0; return; }
  if(a==="tr"){ s.transpose=clamp((s.transpose||0)+v,-11,11); Store.put(s); }
  if(a==="fs"){ S.fs=clamp(S.fs+v/2,12,34); ls.set("gm.fs",S.fs); }
  if(a==="sp"){ ST.speed=clamp(ST.speed+v,1,15); }
  if(a==="diag"){ S.stDiag=!S.stDiag; }
  const top=$("#stbody")?.scrollTop||0;
  if(a==="scroll"){ ST.scroll=!ST.scroll; ST.last=0; ST.acc=0; if(ST.scroll) ST.raf=requestAnimationFrame(scrollLoop); }
  renderStage(); $("#stbody").scrollTop=top;
});
document.addEventListener("keydown",e=>{ if(!$("#stage").hidden && e.key==="Escape") closeStage(); });

/* ---------- events ---------- */
function moveIn(arr,i,d){ const j=i+d; if(j<0||j>=arr.length) return; [arr[i],arr[j]]=[arr[j],arr[i]]; }
function arm(key){ if(S.armed===key){ S.armed=null; return true; } S.armed=key; clearTimeout(arm._t); arm._t=setTimeout(()=>{ S.armed=null; render(); },3500); return false; }
app.addEventListener("click", async e=>{
  const b=e.target.closest("[data-act]"); if(!b || b.tagName==="SELECT") return;
  const a=b.dataset.act, v=b.dataset.v, s=curSong();
  switch(a){
    case "tab": S.tab=v; S.armed=null; ls.set("gm.tab",v); break;
    case "song": S.songId=v; S.armed=null; window.scrollTo(0,0); break;
    case "back": if(S.tab==="songs") S.songId=null; else S.plId=null; break;
    case "convreplace": case "convappend": {
      const out=convertChordSheet(S.conv.text); if(!out){ toast("วางเนื้อเพลงก่อน"); return; }
      s.body = a==="convreplace" ? out : ((s.body||"").trimEnd()+"\n\n"+out); Store.put(s);
      S.conv.text=""; S.conv.open=false; toast(a==="convreplace"?"แทนที่เนื้อเพลงแล้ว":"ต่อท้ายแล้ว"); break; }
    case "addsong": { const n=newSong(); S.songId=n.id; S.view="edit"; S.q=""; break; }
    case "view": S.view=v; S.armed=null; break;
    case "stage": if(s) openStage([s.id]); return;
    case "tr": s.transpose = v==="0"?0:clamp((s.transpose||0)+(+v),-11,11); Store.put(s); break;
    case "fs": S.fs=clamp(S.fs+(+v),12,30); ls.set("gm.fs",S.fs); break;
    case "dupsong": { const c=clone(s); c.id=uid("s"); c.title=s.title+" (สำเนา)"; delete c.example; (c.rig||[]).forEach(u=>u.uid=uid("u")); Store.put(c,50); S.songId=c.id; toast("ทำสำเนาแล้ว"); break; }
    case "delsong": if(arm("song")){ const id=s.id; Store.del(id); if(Store.get("tsl-"+id)) Store.del("tsl-"+id); playlists().forEach(p=>{ if(p.songIds.includes(id)){ p.songIds=p.songIds.filter(x=>x!==id); Store.put(p);} }); S.songId=null; toast("ลบเพลงแล้ว"); } break;
    case "pickup": s.pickup=+v; Store.put(s); break;
    case "addunit": { const id=$("#t-adddev").value; const d=Store.get(id); if(!d){ toast("เลือกอุปกรณ์ก่อน"); return; } s.rig=s.rig||[]; s.rig.push(newUnit(d)); Store.put(s); break; }
    case "umove": moveIn(s.rig,+b.dataset.i,+v); Store.put(s); break;
    case "udel": s.rig.splice(+b.dataset.i,1); Store.put(s); break;
    case "uon": { const u=s.rig[+b.dataset.i]; u.on=!u.on; Store.put(s); break; }
    case "bon": { const u=s.rig[+b.dataset.i]; const bl=u.blocks.find(x=>x.key===v); bl.on=!bl.on; S.sel[u.uid]=v; Store.put(s); break; }
    case "bsel": S.sel[b.dataset.u]=v; break;
    case "tslup": $("#tslfile").click(); return;
    case "tslrm": Store.del("tsl-"+s.id); break;
    case "tsldl": { const t=Store.get("tsl-"+s.id); await saveFile(t.filename, t.content); return; }
    case "addpl": { const p={kind:"playlist",id:uid("p"),name:"เพลย์ลิสต์ใหม่",songIds:[]}; Store.put(p,50); S.plId=p.id; break; }
    case "pl": S.plId=v; S.armed=null; break;
    case "pladd": { const p=Store.get(S.plId); const id=$("#pl-add").value; if(!id){ toast("เลือกเพลงก่อน"); return; } p.songIds.push(id); Store.put(p); break; }
    case "plmv": { const p=Store.get(S.plId); moveIn(p.songIds,+b.dataset.i,+v); Store.put(p); break; }
    case "plrm": { const p=Store.get(S.plId); p.songIds.splice(+b.dataset.i,1); Store.put(p); break; }
    case "plplay": { const p=Store.get(S.plId); const q=p.songIds.filter(id=>Store.get(id)); if(q.length) openStage(q,0); return; }
    case "delpl": if(arm("pl")){ Store.del(S.plId); S.plId=null; } break;
    case "addg": { const g={kind:"guitar",id:uid("g"),name:"กีตาร์ใหม่",brand:"",pickups:"SSS",tuning:TUNINGS[0],color:"#8A8F8C",knobs:["Volume","Tone"],notes:""}; Store.put(g,50); S.gearOpen=g.id; break; }
    case "addd": { const t=PEDAL_TYPES.od; const d={kind:"device",id:uid("d"),name:"Overdrive",brand:"",form:"pedal",ptype:"od",color:t.c,knobs:[...t.k],notes:""}; Store.put(d,50); S.gearOpen=d.id; break; }
    case "addgt1": { const d={kind:"device",id:uid("d"),name:"Boss GT-1",brand:"BOSS",form:"multi",color:"#1A1C1B",notes:""}; Store.put(d,50); S.gearOpen=d.id; break; }
    case "gopen": S.gearOpen = S.gearOpen===v?null:v; S.armed=null; break;
    case "delitem": if(arm(v)){ Store.del(v); S.gearOpen=null; toast("ลบแล้ว"); } break;
    case "export": return exportAll();
    case "signout": await sb.auth.signOut(); return;
    case "signin": Store.ready=false; showLogin(); return;
    case "import": $("#importfile").click(); return;
    default: return;
  }
  render();
});
app.addEventListener("toggle", e=>{ if(e.target.id==="conv-box") S.conv.open=e.target.open; }, true);
app.addEventListener("change", e=>{
  const t=e.target, s=curSong();
  if(t.dataset.act==="guitar"){ s.guitarId=t.value; s.pickup=0; Store.put(s); render(); return; }
  if(t.dataset.gf && (t.tagName==="SELECT" || t.type==="color")){ gearField(t); render(); }
});
app.addEventListener("input", e=>{
  const t=e.target;
  if(t.id==="conv-in"){ S.conv.text=t.value; $("#conv-out").value=convertChordSheet(t.value); return; }
  if(t.id==="q"){ S.q=t.value; $("#songlist").innerHTML=songListHTML(); return; }
  const s=curSong();
  if(t.dataset.f && S.tab==="songs" && s){
    let v=t.value; if(t.type==="number") v = t.value===""? "" : +t.value;
    s[t.dataset.f]=v; Store.put(s);
    if(["title","artist","key"].includes(t.dataset.f)) { const li=$("#songlist"); if(li) li.innerHTML=songListHTML(); }
    return;
  }
  if(t.dataset.uf){ const u=s.rig[+t.dataset.i]; u[t.dataset.uf] = t.type==="number"? +t.value : (t.dataset.uf==="patchName"||t.dataset.uf==="slot"? t.value.toUpperCase() : t.value); if(t.dataset.uf!=="note" && t.type!=="number"){ const pos=t.selectionStart; t.value=u[t.dataset.uf]; try{t.setSelectionRange(pos,pos);}catch(_){} } Store.put(s); return; }
  if(t.dataset.bt){ const u=s.rig[+t.dataset.i]; const bl=u.blocks.find(x=>x.key===t.dataset.bt); bl.type=t.value.toUpperCase(); const pos=t.selectionStart; t.value=bl.type; try{t.setSelectionRange(pos,pos);}catch(_){} const lab=t.closest(".unit")?.querySelector(`.blk[aria-current="true"] .bt`); if(lab) lab.textContent=bl.type||"—"; Store.put(s); return; }
  if(t.dataset.pf){ const p=Store.get(S.plId); p[t.dataset.pf]=t.value; Store.put(p); return; }
  if(t.dataset.gf && t.tagName!=="SELECT" && t.type!=="color"){ gearField(t); }
});
function gearField(t){
  const it=Store.get(t.dataset.id); const f=t.dataset.gf;
  if(f==="knobs") it.knobs=t.value.split(",").map(x=>x.trim()).filter(Boolean);
  else if(f==="ptype"){ it.ptype=t.value; const pt=PEDAL_TYPES[t.value]; it.knobs=[...pt.k]; it.color=pt.c; if(!it.name || Object.values(PEDAL_TYPES).some(x=>x.l===it.name) || it.name==="Overdrive") it.name=pt.l; }
  else it[f]=t.value;
  Store.put(it);
  // keep pedal units in songs aligned to renamed knobs
  if(f==="knobs"||f==="ptype"){ songs().forEach(s=>{ let ch=false; (s.rig||[]).forEach(u=>{ if(u.deviceId===it.id){ const old=u.blocks[0].params; u.blocks[0].params=it.knobs.map((n,i)=>P(n,old[i]?.v??5,0,10)); ch=true; } }); if(ch) Store.put(s,900); }); }
}
/* knobs: drag + keyboard */
let drag=null;
function knobTarget(el, s){
  if(el.dataset.gk!==undefined){ const n=el.dataset.gk; return {p:{n,v:s.gknobs?.[n]??10,min:0,max:10,u:""}, set:v=>{ s.gknobs=s.gknobs||{}; s.gknobs[n]=v; }}; }
  const u=s.rig.find(x=>x.uid===el.dataset.u); const p=u.blocks[+el.dataset.b].params[+el.dataset.p];
  return {p, set:v=>{p.v=v;}};
}
function applyKnob(el, v){
  const s=curSong(); const k=knobTarget(el,s); const st=stepOf(k.p);
  v = clamp(Math.round(v/st)*st, k.p.min, k.p.max); v = +v.toFixed(st<1?1:0);
  if(v===k.p.v) return; k.set(v); const p={...k.p, v};
  el.querySelector("svg").outerHTML = knobInner(p); el.querySelector(".kv").innerHTML=fmt(p,v); el.setAttribute("aria-valuenow",v);
  Store.put(s, 700);
}
app.addEventListener("pointerdown", e=>{
  const el=e.target.closest(".knob"); if(!el) return; const s=curSong(); if(!s) return;
  const k=knobTarget(el,s); drag={el, y:e.clientY, v:k.p.v, range:k.p.max-k.p.min}; el.classList.add("drag"); el.setPointerCapture(e.pointerId); e.preventDefault();
});
app.addEventListener("pointermove", e=>{ if(!drag) return; const dv=(drag.y-e.clientY)/160*drag.range; applyKnob(drag.el, drag.v+dv); });
const endDrag=()=>{ if(drag){ drag.el.classList.remove("drag"); drag=null; } };
app.addEventListener("pointerup", endDrag); app.addEventListener("pointercancel", endDrag);
app.addEventListener("keydown", e=>{
  const el=e.target.closest?.(".knob"); if(!el) return; const s=curSong(); const k=knobTarget(el,s); const r=k.p.max-k.p.min;
  const big = r>=1000 ? 10 : r<=10 ? 0.5 : 2; let d=0;
  if(e.key==="ArrowUp"||e.key==="ArrowRight") d=big; else if(e.key==="ArrowDown"||e.key==="ArrowLeft") d=-big; else if(e.key==="PageUp") d=big*5; else if(e.key==="PageDown") d=-big*5; else return;
  e.preventDefault(); applyKnob(el, k.p.v+d);
});
app.addEventListener("dblclick", e=>{ const el=e.target.closest(".knob"); if(!el) return; const s=curSong(); const k=knobTarget(el,s); applyKnob(el, k.p.min<0?0:(k.p.max<=10?5:Math.round((k.p.min+k.p.max)/2))); });

/* files */
$("#tslfile").addEventListener("change", async e=>{
  const f=e.target.files[0]; e.target.value=""; const s=curSong(); if(!f||!s) return;
  if(f.size>200*1024){ toast("ไฟล์ใหญ่เกิน 200 KB"); return; }
  const text=await f.text();
  Store.put({kind:"tsl",id:"tsl-"+s.id,songId:s.id,filename:f.name,content:text},50); toast("แนบไฟล์แล้ว"); render();
});
$("#importfile").addEventListener("change", async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{ const arr=JSON.parse(await f.text()); if(!Array.isArray(arr)) throw 0; let n=0; arr.forEach(x=>{ if(x&&x.id&&x.kind){ Store.put(x,80+n*30); n++; } }); toast(`นำเข้า ${n} รายการ`); render(); }
  catch(_){ toast("ไฟล์นี้ไม่ใช่ไฟล์สำรองของ TM Guitar"); }
});
async function saveFile(name, data){
  const blob = data instanceof Blob ? data : new Blob([data],{type:"application/octet-stream"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function exportAll(){ const d=new Date(); const name=`tm-guitar-backup-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.json`; saveFile(name, JSON.stringify([...Store.items.values()],null,1)); }

/* ---------- boot ---------- */
let rT=0;
Store.listeners.push(()=>{ cancelAnimationFrame(rT); rT=requestAnimationFrame(()=>{ if(drag) return; const ae=document.activeElement; const id=ae&&ae.id; const pos=ae&&ae.selectionStart;
  if(ae && ae.tagName==="TEXTAREA" && app.contains(ae)) return; // don't disturb typing
  render(); if(!$("#stage").hidden) renderStage();
  if(id){ const n=document.getElementById(id); if(n){ n.focus(); try{ if(pos!=null) n.setSelectionRange(pos,pos);}catch(_){}} } }); });
window.addEventListener("resize", ()=>{ clearTimeout(rT); });
function showLogin(msg){
  app.innerHTML = `<div class="login wrap"><div class="card login-card">
    <div class="brand" style="justify-content:center;margin-bottom:6px"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M21 3l8 8-3 1-6 6c1.6 2.8 1 6.6-1.8 9.4-3.4 3.4-8.4 3.8-11.2 1S4.6 21 8 17.6C10.8 14.8 14.6 14.2 17.4 15.8l6-6z" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/><circle cx="12.6" cy="21.4" r="2.2" fill="var(--accent)"/></svg>TM Guitar</div>
    <p class="hint" style="text-align:center;margin:0 0 14px">เข้าสู่ระบบเพื่อเก็บเพลง คอร์ด และ preset ไว้บน Supabase แล้วเปิดได้ทุกเครื่อง</p>
    <form id="loginform" style="display:grid;gap:10px">
      <label class="f">อีเมล<input type="email" id="lg-email" autocomplete="email" required style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px"></label>
      <label class="f">รหัสผ่าน (อย่างน้อย 6 ตัว)<input type="password" id="lg-pass" autocomplete="current-password" minlength="6" required style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px"></label>
      ${msg?`<div class="notice" id="lg-msg">${esc(msg)}</div>`:`<div class="notice" id="lg-msg" hidden></div>`}
      <button class="btn pri" type="submit" data-mode="in">เข้าสู่ระบบ</button>
      <button class="btn" type="button" id="lg-up">สมัครใช้งานด้วยอีเมลนี้</button>
      <button class="btn ghost" type="button" id="lg-local">ใช้แบบไม่ล็อกอิน (เก็บในเบราว์เซอร์นี้)</button>
    </form></div></div>`;
  const say=t=>{ const m=$("#lg-msg"); m.textContent=t; m.hidden=false; };
  $("#loginform").addEventListener("submit", async e=>{ e.preventDefault(); say("กำลังเข้าสู่ระบบ…");
    const {error}=await sb.auth.signInWithPassword({email:$("#lg-email").value.trim(), password:$("#lg-pass").value});
    if(error) say(error.message==="Invalid login credentials"?"อีเมลหรือรหัสผ่านไม่ถูกต้อง":error.message==="Email not confirmed"?"ยังไม่ได้ยืนยันอีเมล เปิดลิงก์ในอีเมลที่ส่งไปก่อน":error.message); });
  $("#lg-up").addEventListener("click", async ()=>{ const email=$("#lg-email").value.trim(), password=$("#lg-pass").value;
    if(!email||password.length<6){ say("ใส่อีเมลและรหัสผ่านอย่างน้อย 6 ตัวก่อน"); return; }
    say("กำลังสมัคร…");
    const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+"/auth/callback"}});
    if(error) say(error.message); else if(!data.session) say("ส่งอีเมลยืนยันแล้ว กดลิงก์ในอีเมล แล้วกลับมาเข้าสู่ระบบที่หน้านี้"); });
  $("#lg-local").addEventListener("click", ()=>{ ls.set("gm.localonly","1"); Store.initLocal(); render(); });
}
const CFG = window.GM_CONFIG || {};
// ข้อความ error จากลิงก์ยืนยันอีเมล (เช่น หมดอายุ / ถูกใช้ไปแล้ว)
let authErr = (() => {
  const hp = new URLSearchParams(location.hash.slice(1));
  if (!hp.get("error")) return "";
  const code = hp.get("error_code");
  const desc = (hp.get("error_description") || "").replace(/\+/g, " ");
  history.replaceState(null, "", "/");
  return code === "otp_expired"
    ? "ลิงก์ยืนยันหมดอายุหรือถูกใช้ไปแล้ว ลองเข้าสู่ระบบ หรือสมัครใหม่เพื่อรับลิงก์ใหม่"
    : (desc || "ยืนยันอีเมลไม่สำเร็จ ลองใหม่อีกครั้ง");
})();
const sb = (window.supabase && CFG.supabaseUrl) ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey) : null;
let curUid=null, authInit=false;
if(!sb){ Store.initLocal(); render(); }
else {
  sb.auth.onAuthStateChange((ev, session)=>{
    const id = session?.user?.id || null;
    if(authInit && id===curUid && ev!=="SIGNED_OUT") return;
    authInit=true; curUid=id;
    setTimeout(async ()=>{
      if(location.pathname.startsWith("/auth/callback")) history.replaceState(null,"","/");
      if(session){ ls.set("gm.localonly",""); await Store.initSupabase(session); render(); }
      else if(ls.get("gm.localonly")==="1"){ Store.initLocal(); render(); }
      else { Store.ready=false; if(Store.chan) sb.removeChannel(Store.chan); Store.items.clear(); Store.mode="memory"; showLogin(authErr); authErr=""; }
    },0);
  });
}
})();
</script>
